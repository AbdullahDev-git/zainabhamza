<!DOCTYPE html>

<html class="bg-[#1e050c]" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <meta content="mobile_blank" name="shell-type" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&amp;family=Cinzel:wght@400;500;600;700&amp;family=Montserrat:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "burgundy-deep": "#25050f",
                        "burgundy-royal": "#3a0a17",
                        "burgundy-rich": "#4e1022",
                        "gold-light": "#ffebaa",
                        "gold-bright": "#f3cf7a",
                        "gold-base": "#d4af37",
                        "gold-antique": "#b88a28",
                        "gold-muted": "#967020",
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        cormorant: ['"Cormorant Garamond"', 'serif'],
                        cinzel: ['"Cinzel"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        @layer base {

            html,
            body {
                width: 100%;
                min-height: 100%;
                margin: 0;
                padding: 0;
                background-color: #1e050c;
                color: #f7ecd5;
                -webkit-font-smoothing: antialiased;
            }

            body {
                overscroll-behavior-y: none;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* Shimmer reflection animation across monogram seal */
        @keyframes sweepGlint {
            0% {
                transform: translateX(-150%) rotate(25deg);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            50% {
                transform: translateX(150%) rotate(25deg);
                opacity: 0;
            }

            100% {
                transform: translateX(150%) rotate(25deg);
                opacity: 0;
            }
        }

        .glint-effect {
            animation: sweepGlint 5s ease-in-out infinite;
        }

        /* Ambient pulse glow */
        @keyframes auraGlow {

            0%,
            100% {
                opacity: 0.35;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.08);
            }
        }

        .aura-pulse {
            animation: auraGlow 4s ease-in-out infinite;
        }

        /* Subtle gold dust sparkle float */
        @keyframes floatSparkle {

            0%,
            100% {
                opacity: 0.2;
                transform: translateY(0px) scale(0.8);
            }

            50% {
                opacity: 0.85;
                transform: translateY(-4px) scale(1.15);
            }
        }

        .sparkle-1 {
            animation: floatSparkle 3.5s ease-in-out infinite;
        }

        .sparkle-2 {
            animation: floatSparkle 4.2s ease-in-out infinite 1.2s;
        }

        .sparkle-3 {
            animation: floatSparkle 3.8s ease-in-out infinite 2s;
        }
    </style>
</head>

<body class="bg-[#1e050c] min-h-screen flex flex-col items-center justify-start antialiased selection:bg-gold-base/30">
    <div
        class="w-full max-w-[430px] min-h-screen flex flex-col relative mx-auto overflow-hidden bg-[#24050f] shadow-2xl">
        <main class="flex-1 w-full relative flex flex-col">
            <!-- Luxurious Velvet Folio Interactive Cover -->
            <div class="relative w-full min-h-screen flex flex-col justify-between items-center px-7 py-9 select-none cursor-pointer overflow-hidden transition-all duration-700 active:scale-[0.99]"
                id="folioCover">
                <!-- Depth Gradient: Velvet vignette with royal burgundy heart -->
                <div
                    class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_#4a0e20_0%,_#320914_45%,_#1a030b_90%,_#110106_100%)] pointer-events-none">
                </div>
                <!-- Tactile Suede/Leather Subtle Noise Screen Overlay -->
                <div
                    class="absolute inset-0 opacity-[0.035] pointer-events-none mix-blend-overlay bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]">
                </div>
                <!-- Left Spine Book-Fold Shadow Effect (Handcrafted Folio Touch) -->
                <div
                    class="absolute left-0 top-0 bottom-0 w-5 bg-gradient-to-r from-black/80 via-black/30 to-transparent pointer-events-none z-30">
                </div>
                <div
                    class="absolute left-[3px] top-0 bottom-0 w-[0.75px] bg-gradient-to-b from-transparent via-gold-bright/30 to-transparent pointer-events-none z-30">
                </div>
                <!-- Subtle Floating Gold Dust Elements -->
                <div class="absolute inset-0 pointer-events-none overflow-hidden z-10">
                    <div
                        class="sparkle-1 absolute top-[18%] left-[22%] w-1 h-1 rounded-full bg-gold-light blur-[0.4px] shadow-[0_0_6px_#f3cf7a]">
                    </div>
                    <div
                        class="sparkle-2 absolute top-[28%] right-[19%] w-1.5 h-1.5 rounded-full bg-gold-light blur-[0.5px] shadow-[0_0_8px_#f3cf7a]">
                    </div>
                    <div
                        class="sparkle-3 absolute bottom-[32%] left-[16%] w-1 h-1 rounded-full bg-gold-bright blur-[0.3px] shadow-[0_0_5px_#f3cf7a]">
                    </div>
                    <div
                        class="sparkle-1 absolute bottom-[22%] right-[24%] w-1.5 h-1.5 rounded-full bg-gold-light blur-[0.5px] shadow-[0_0_8px_#f3cf7a]">
                    </div>
                </div>
                <!-- ================= ORNATE BESPOKE GOLD FRAME (Double Fine Hairline) ================= -->
                <div class="absolute inset-4 pointer-events-none z-20 flex flex-col justify-between">
                    <!-- Outer border -->
                    <div class="absolute inset-0 border border-gold-bright/35 rounded-sm"></div>
                    <!-- Inner delicate offset hairline -->
                    <div class="absolute inset-[6px] border border-gold-bright/20 rounded-sm"></div>
                    <!-- Top Row Corners & Center Arch Crest -->
                    <div class="relative w-full flex justify-between items-start p-1">
                        <!-- Top Left Filigree Corner -->
                        <svg class="w-10 h-10 text-gold-bright/70" fill="none" viewbox="0 0 40 40">
                            <path d="M2 38 V10 C2 5.58 5.58 2 10 2 H38" stroke="currentColor" stroke-width="1.25">
                            </path>
                            <path d="M5 34 V12 C5 8.13 8.13 5 12 5 H34" stroke="currentColor" stroke-dasharray="1.5 2"
                                stroke-width="0.6"></path>
                            <circle cx="12" cy="12" fill="currentColor" r="2.2"></circle>
                            <circle cx="2" cy="38" fill="currentColor" r="1.2"></circle>
                            <circle cx="38" cy="2" fill="currentColor" r="1.2"></circle>
                            <path d="M8 8 C14 14 14 14 20 8" stroke="currentColor" stroke-width="0.6"></path>
                        </svg>
                        <!-- Center Arch / Crest Header -->
                        <div class="flex flex-col items-center pt-0.5">
                            <div class="flex items-center space-x-2">
                                <span
                                    class="w-8 h-[0.75px] bg-gradient-to-r from-transparent via-gold-bright/60 to-gold-bright"></span>
                                <svg class="w-4 h-4 text-gold-bright" fill="currentColor" viewbox="0 0 24 24">
                                    <path
                                        d="M12 1.5L14.4 7.8L21 8.2L16 12.6L17.5 19L12 15.5L6.5 19L8 12.6L3 8.2L9.6 7.8L12 1.5Z">
                                    </path>
                                </svg>
                                <span
                                    class="w-8 h-[0.75px] bg-gradient-to-l from-transparent via-gold-bright/60 to-gold-bright"></span>
                            </div>
                        </div>
                        <!-- Top Right Filigree Corner -->
                        <svg class="w-10 h-10 text-gold-bright/70 -scale-x-100" fill="none" viewbox="0 0 40 40">
                            <path d="M2 38 V10 C2 5.58 5.58 2 10 2 H38" stroke="currentColor" stroke-width="1.25">
                            </path>
                            <path d="M5 34 V12 C5 8.13 8.13 5 12 5 H34" stroke="currentColor" stroke-dasharray="1.5 2"
                                stroke-width="0.6"></path>
                            <circle cx="12" cy="12" fill="currentColor" r="2.2"></circle>
                            <circle cx="2" cy="38" fill="currentColor" r="1.2"></circle>
                            <circle cx="38" cy="2" fill="currentColor" r="1.2"></circle>
                            <path d="M8 8 C14 14 14 14 20 8" stroke="currentColor" stroke-width="0.6"></path>
                        </svg>
                    </div>
                    <!-- Bottom Row Corners & Center Diamond Accent -->
                    <div class="relative w-full flex justify-between items-end p-1">
                        <!-- Bottom Left Filigree Corner -->
                        <svg class="w-10 h-10 text-gold-bright/70 -scale-y-100" fill="none" viewbox="0 0 40 40">
                            <path d="M2 38 V10 C2 5.58 5.58 2 10 2 H38" stroke="currentColor" stroke-width="1.25">
                            </path>
                            <path d="M5 34 V12 C5 8.13 8.13 5 12 5 H34" stroke="currentColor" stroke-dasharray="1.5 2"
                                stroke-width="0.6"></path>
                            <circle cx="12" cy="12" fill="currentColor" r="2.2"></circle>
                            <circle cx="2" cy="38" fill="currentColor" r="1.2"></circle>
                            <circle cx="38" cy="2" fill="currentColor" r="1.2"></circle>
                            <path d="M8 8 C14 14 14 14 20 8" stroke="currentColor" stroke-width="0.6"></path>
                        </svg>
                        <!-- Center Bottom Floral Finial -->
                        <div class="flex items-center space-x-2 pb-0.5 opacity-80">
                            <span
                                class="w-10 h-[0.75px] bg-gradient-to-r from-transparent via-gold-bright/50 to-gold-bright"></span>
                            <div class="w-1.5 h-1.5 rotate-45 border border-gold-bright bg-gold-bright/40"></div>
                            <span
                                class="w-10 h-[0.75px] bg-gradient-to-l from-transparent via-gold-bright/50 to-gold-bright"></span>
                        </div>
                        <!-- Bottom Right Filigree Corner -->
                        <svg class="w-10 h-10 text-gold-bright/70 scale-x-[-1] scale-y-[-1]" fill="none"
                            viewbox="0 0 40 40">
                            <path d="M2 38 V10 C2 5.58 5.58 2 10 2 H38" stroke="currentColor" stroke-width="1.25">
                            </path>
                            <path d="M5 34 V12 C5 8.13 8.13 5 12 5 H34" stroke="currentColor" stroke-dasharray="1.5 2"
                                stroke-width="0.6"></path>
                            <circle cx="12" cy="12" fill="currentColor" r="2.2"></circle>
                            <circle cx="2" cy="38" fill="currentColor" r="1.2"></circle>
                            <circle cx="38" cy="2" fill="currentColor" r="1.2"></circle>
                            <path d="M8 8 C14 14 14 14 20 8" stroke="currentColor" stroke-width="0.6"></path>
                        </svg>
                    </div>
                </div>
                <!-- ================= TOP HEADER (Sacred Nikkah Invocation) ================= -->
                <header class="relative z-20 pt-6 flex flex-col items-center text-center">
                    <!-- Bismillah Inscription in Elegant Fine Script -->
                    <div class="font-cormorant italic text-[18px] text-gold-light/85 tracking-wider font-light mb-1">
                        Bismillah ir-Rahman ir-Rahim
                    </div>
                    <!-- Royal Registry Title -->
                    <div
                        class="font-cinzel text-[10.5px] uppercase tracking-[0.32em] text-gold-bright/80 font-medium mt-1">
                        Royal Invitation • Folio
                    </div>
                </header>
                <!-- ================= CENTER MEDALLION & BESPOKE LOGO ================= -->
                <div class="relative z-20 flex flex-col items-center justify-center my-auto w-full">
                    <!-- Golden Halo Specular Atmosphere -->
                    <div
                        class="absolute w-52 h-52 rounded-full bg-gradient-to-tr from-gold-bright/20 via-gold-base/15 to-transparent blur-2xl aura-pulse pointer-events-none">
                    </div>
                    <!-- Medallion Frame with Gold Leaf Outer Bevel -->
                    <div
                        class="relative w-[172px] h-[172px] rounded-full p-[3px] bg-gradient-to-b from-gold-bright via-gold-base to-gold-antique shadow-[0_12px_36px_rgba(0,0,0,0.7),0_0_24px_rgba(212,175,55,0.25)] flex items-center justify-center transition-transform duration-500 hover:scale-105">
                        <!-- Dark Debossed Inset Ring -->
                        <div
                            class="w-full h-full rounded-full p-[2px] bg-[#1d030b] flex items-center justify-center overflow-hidden relative shadow-inner">
                            <!-- User Uploaded Couple Monogram Logo https://lh3.googleusercontent.com/aida-public/AB6AXuCuAaUH32s34VXl_3cYnEOud2RG5nlwqyPeCcXLbCC_cBijLA4PCjaZricck00ldO17xld1Yu1NLflpJ9_9jgAIrYALMvikPLHLPSP5jZhdM2_zYRJUrZgIOh3qz0Ol40evfYoyVOTK0FirEwMOuK4_m5XfFTDb1XCN5VffrFU9pZJ7A5SOb-7HsU_rbTaZph69qOzX_5r1UWYsZTbsI3H0AF2eEAG-ir8be23N05KR3bBPg6StvY2q -->
                            <img alt="Z &amp; H Royal Monogram Seal"
                                class="w-full h-full object-cover rounded-full select-none pointer-events-none"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuAaUH32s34VXl_3cYnEOud2RG5nlwqyPeCcXLbCC_cBijLA4PCjaZricck00ldO17xld1Yu1NLflpJ9_9jgAIrYALMvikPLHLPSP5jZhdM2_zYRJUrZgIOh3qz0Ol40evfYoyVOTK0FirEwMOuK4_m5XfFTDb1XCN5VffrFU9pZJ7A5SOb-7HsU_rbTaZph69qOzX_5r1UWYsZTbsI3H0AF2eEAG-ir8be23N05KR3bBPg6StvY2q" />
                            <!-- Shimmer Gilded Glint Sweep -->
                            <div
                                class="absolute inset-0 w-full h-[200%] -top-1/2 bg-gradient-to-r from-transparent via-white/25 to-transparent pointer-events-none glint-effect">
                            </div>
                        </div>
                    </div>
                    <!-- ================= TYPOGRAPHY: THE NIKKAH OF ZAINAB & HAMZA ================= -->
                    <div class="mt-7 flex flex-col items-center text-center px-4">
                        <!-- Small-caps gold tracking subtitle -->
                        <span class="font-cinzel text-[11px] tracking-[0.35em] text-gold-bright uppercase font-medium">
                            The Nikkah Of
                        </span>
                        <!-- Couple Names in High-Contrast Luxury Serif -->
                        <h1
                            class="font-serif text-[32px] leading-[1.25] text-gold-light font-normal tracking-wide mt-2 drop-shadow-[0_2px_10px_rgba(0,0,0,0.6)]">
                            Zainab <span
                                class="font-cormorant italic text-[30px] text-gold-bright/90 font-light">&amp;</span>
                            Hamza
                        </h1>
                        <!-- Date & Sacred Union Details -->
                        <div class="flex items-center space-x-3 mt-3 text-gold-bright/75">
                            <span class="w-6 h-[0.5px] bg-gold-bright/40"></span>
                            <p class="font-cinzel text-[10px] tracking-[0.24em] uppercase font-light">
                                Fourteenth of November • MMXXV
                            </p>
                            <span class="w-6 h-[0.5px] bg-gold-bright/40"></span>
                        </div>
                    </div>
                    <!-- Animated Slender Gold Loading / Progress Bar -->
                    <div class="mt-5 w-[130px] flex flex-col items-center">
                        <div class="w-full h-[1.5px] bg-gold-base/20 rounded-full relative overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-gold-muted via-gold-bright to-gold-light rounded-full w-1/3 transition-all duration-300 relative shadow-[0_0_8px_#f3cf7a]"
                                id="progressBar">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ================= BOTTOM INTERACTIVE PROMPT: TAP TO UNVEIL ================= -->
                <footer class="relative z-20 pb-4 flex flex-col items-center text-center group" id="unveilButton">
                    <!-- Breathing Glow Button / Prompt -->
                    <div
                        class="px-5 py-2 rounded-full border border-gold-bright/30 bg-gold-base/10 backdrop-blur-sm flex items-center space-x-2.5 transition-all duration-300 hover:border-gold-bright/60 hover:bg-gold-base/15">
                        <span
                            class="w-1.5 h-1.5 rounded-full bg-gold-bright shadow-[0_0_8px_#ffebaa] animate-ping opacity-75"></span>
                        <span class="font-cinzel text-[11px] tracking-[0.28em] text-gold-light uppercase font-semibold">
                            Tap to Unveil
                        </span>
                        <span
                            class="material-symbols-outlined text-[16px] text-gold-bright transition-transform duration-300 group-hover:translate-y-0.5"
                            style="font-variation-settings: 'FILL' 1;">
                            keyboard_arrow_down
                        </span>
                    </div>
                    <!-- Micro Wax Seal Footnote -->
                    <div
                        class="mt-2.5 flex items-center space-x-2 text-[9.5px] tracking-[0.2em] font-sans text-gold-bright/50 uppercase">
                        <span>Sealed with Blessings</span>
                        <span>•</span>
                        <span>Al-Qawl al-Thabit</span>
                    </div>
                </footer>
            </div>
        </main>
    </div>
    <script>
        (function () {
            const progressBar = document.getElementById('progressBar');
            const folioCover = document.getElementById('folioCover');
            const unveilButton = document.getElementById('unveilButton');

            // Gentle interactive progress bar simulation
            let progress = 25;
            const progressTimer = setInterval(() => {
                if (progress < 100) {
                    progress += Math.floor(Math.random() * 20) + 12;
                    if (progress > 100) progress = 100;
                    if (progressBar) {
                        progressBar.style.width = progress + '%';
                    }
                } else {
                    clearInterval(progressTimer);
                }
            }, 220);

            // Tap to Unveil feedback animation
            if (folioCover) {
                folioCover.addEventListener('click', function () {
                    folioCover.style.transform = 'scale(0.985)';
                    if (unveilButton) {
                        unveilButton.classList.add('opacity-70');
                    }
                    setTimeout(() => {
                        folioCover.style.transform = 'scale(1)';
                        if (unveilButton) {
                            unveilButton.classList.remove('opacity-70');
                        }
                    }, 240);
                });
            }
        })();
    </script>
</body>

</html>
