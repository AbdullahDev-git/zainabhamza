<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z &amp; H Monogram Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--page:#1e050c;--ink:#f0d9a0;--line:#d4a94f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#150308;--ink:#f0d9a0;--line:#d4a94f}}
:root[data-theme="dark"]{--page:#150308;--ink:#f0d9a0;--line:#d4a94f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#1e050c;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
::-webkit-scrollbar{display:none}
svg{width:min(92vw,80vh,720px);height:auto;display:block;border-radius:24px;box-shadow:0 24px 60px rgba(30,0,8,.35)}
.t{font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive}
.o{transform-box:fill-box;transform-origin:center}
#wg{transform-origin:0 0}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 800 800" role="img" aria-label="Animated Z and H monogram with an ampersand, gold double ring and a butterfly">
<defs>
<radialGradient id="bg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#4a0d1d"/><stop offset="1" stop-color="#2c0610"/></radialGradient>
<linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="420" y2="0">
<stop offset="0" stop-color="#d9b055"/><stop offset=".42" stop-color="#d9b055"/><stop offset=".5" stop-color="#fff0bd"/><stop offset=".58" stop-color="#d9b055"/><stop offset="1" stop-color="#d9b055"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-420 0;520 0;520 0" keyTimes="0;.35;1" dur="7s" begin="4s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gH" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="600" y2="0">
<stop offset="0" stop-color="#a97d2e"/><stop offset=".42" stop-color="#a97d2e"/><stop offset=".5" stop-color="#f0d083"/><stop offset=".58" stop-color="#a97d2e"/><stop offset="1" stop-color="#a97d2e"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-420 0;520 0;520 0" keyTimes="0;.35;1" dur="7s" begin="4.4s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="gW" cx=".25" cy=".7" r=".9"><stop offset="0" stop-color="#fbe7a6"/><stop offset=".6" stop-color="#d9b055"/><stop offset="1" stop-color="#a97d2e"/></radialGradient>
<filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#d4a94f" flood-opacity=".28"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<circle id="r1" cx="400" cy="400" r="368" fill="none" stroke="#d4a94f" stroke-width="7" transform="rotate(-90 400 400)"/>
<circle id="r2" cx="400" cy="400" r="347" fill="none" stroke="#d4a94f" stroke-width="2" transform="rotate(-90 400 400)"/>
<g id="dust"></g><g filter="url(#gl)">
<text id="L" class="t o" x="335" y="505" font-size="350" text-anchor="middle" fill="url(#gL)">Z</text>
<text id="H" class="t o" x="505" y="525" font-size="350" text-anchor="middle" fill="url(#gH)">H</text>
<text id="A" class="t o" x="398" y="240" font-size="104" text-anchor="middle" fill="#d9b055">&amp;</text>
</g>
<line id="dl" class="o" x1="320" y1="638" x2="500" y2="638" stroke="#d4a94f" stroke-width="2.5"/>
<circle id="dot" class="o" cx="410" cy="638" r="6" fill="#d4a94f"/>
<path id="route" fill="none" stroke="none"/>
<g id="sp"></g>
<g id="bf" opacity="0" filter="url(#gl)"><g id="bb" transform="scale(.75)">
<g id="wg">
<g id="wr"><path d="M3 -4C8 -42 50 -68 72 -46C86 -30 66 -6 3 4Z" fill="url(#gW)" stroke="#8a6122" stroke-width="1.3"/><path d="M3 4C42 2 66 20 58 46C50 64 16 50 3 12Z" fill="url(#gW)" stroke="#8a6122" stroke-width="1.3"/><path d="M4 -2C24 -18 46 -34 64 -42M4 0C28 -8 52 -14 76 -32M4 6C28 12 44 28 52 44" fill="none" stroke="#8a6122" stroke-width=".9" opacity=".5"/><path d="M12 -8C30 -28 50 -46 66 -50C52 -36 34 -16 12 -2Z" fill="#fff6d2" opacity=".22"/><g fill="#fff3c8"><circle cx="64" cy="-47" r="2.6"/><circle cx="75" cy="-37" r="2.2"/><circle cx="72" cy="-24" r="1.8"/><circle cx="55" cy="40" r="2.2"/><circle cx="46" cy="52" r="1.8"/></g></g>
<use href="#wr" transform="scale(-1 1)"/>
</g>
<ellipse cx="0" cy="8" rx="3.6" ry="17" fill="#4a2a10"/><circle cx="0" cy="-12" r="5.6" fill="#4a2a10"/><circle cx="-2.2" cy="-13" r="1.5" fill="#fff3c8"/><circle cx="2.2" cy="-13" r="1.5" fill="#fff3c8"/>
<path d="M-2 -16C-4 -30 -10 -37 -18 -38M2 -16C4 -30 10 -37 18 -38" stroke="#f3dc95" fill="none" stroke-width="1.5" stroke-linecap="round"/><circle cx="-18" cy="-38" r="2.2" fill="#f3dc95"/><circle cx="18" cy="-38" r="2.2" fill="#f3dc95"/>
</g></g>
</svg>
<script>
const $=id=>document.getElementById(id),E="cubic-bezier(.22,1,.36,1)",BACK="cubic-bezier(.34,1.35,.5,1)";
const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:"both",easing:E},o));
const pts=[[110,610],[215,500],[300,360],[395,300],[470,200],[420,120],[345,175],[400,255],[500,330],[610,260],[650,370],[580,470],[500,400],[430,330],[360,430],[290,520],[370,575],[480,545],[560,605],[470,650],[410,628]];
let d="M"+pts[0];
for(let i=0;i<pts.length-1;i++){
  const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2}`;
}
$("route").setAttribute("d",d);
const route=$("route"),LEN=route.getTotalLength(),FT=10500,START=4300;
let raf=0,flap=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sm=t=>t*t*(3-2*t);

function sparkle(x,y){
  const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",1.2+Math.random()*2.2);c.setAttribute("fill","#f6dc8e");
  $("sp").appendChild(c);
  const dx=(Math.random()-.5)*26,dy=Math.random()*22+6;
  c.animate([{opacity:.95,transform:"translate(0,0) scale(1)"},{opacity:0,transform:`translate(${dx}px,${dy}px) scale(.1)`}],{duration:1100+Math.random()*500,easing:"ease-out"}).onfinish=()=>c.remove();
}

function layout(){
  try{
    const FF='"Great Vibes","Snell Roundhand","Apple Chancery",cursive',c=document.createElement("canvas").getContext("2d");c.textAlign="center";
    const m=(ch,s)=>{c.font=s+"px "+FF;const r=c.measureText(ch);return{l:r.actualBoundingBoxLeft,r:r.actualBoundingBoxRight,a:r.actualBoundingBoxAscent,d:r.actualBoundingBoxDescent}};
    const z=m("Z",350),h=m("H",350),n=m("&",104),zx=-85,hx=85;
    const minX=Math.min(zx-z.l,hx-h.l),maxX=Math.max(zx+z.r,hx+h.r),minY=-Math.max(z.a,h.a),maxY=Math.max(z.d,h.d);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2,by=400-cy;
    const v=[400-cx+zx,400-cx+hx,by,400-(n.r-n.l)/2,by+minY-10-n.d];
    if(!v.every(Number.isFinite))return;
    $("L").setAttribute("x",v[0]);$("L").setAttribute("y",v[2]);
    $("H").setAttribute("x",v[1]);$("H").setAttribute("y",v[2]);
    $("A").setAttribute("x",v[3]);$("A").setAttribute("y",v[4]);
  }catch(e){}
}
function play(){
  layout();
  cancelAnimationFrame(raf);
  document.getAnimations().forEach(a=>a.cancel());
  $("sp").replaceChildren();
  [$("r1"),$("r2")].forEach((c,i)=>{
    const L=2*Math.PI*c.r.baseVal.value;c.style.strokeDasharray=L;
    A(c,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:2400,delay:i*300,easing:"cubic-bezier(.65,0,.35,1)"});
  });
  A($("L"),[{opacity:0,transform:"translateX(-280px) rotate(-8deg)"},{opacity:1,transform:"none"}],{duration:2100,delay:1000,easing:BACK});
  A($("H"),[{opacity:0,transform:"translateX(280px) rotate(8deg)"},{opacity:1,transform:"none"}],{duration:2100,delay:1000,easing:BACK});
  A($("A"),[{opacity:0,transform:"translateY(-50px) scale(.2) rotate(-45deg)"},{opacity:1,transform:"none"}],{duration:1400,delay:2900,easing:BACK});
  A($("dot"),[{transform:"scale(0)"},{transform:"scale(1)"}],{duration:700,delay:3300,easing:BACK});
  A($("dl"),[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:1200,delay:3500});
  A($("dot"),[{transform:"scale(1)"},{transform:"scale(1.6)"},{transform:"scale(1)"}],{duration:2600,delay:START+FT,iterations:Infinity,easing:"ease-in-out",composite:"replace"});
  A($("bf"),[{opacity:0},{opacity:1}],{duration:900,delay:START});
  flap=A($("wg"),[{transform:"scaleX(1)"},{transform:"scaleX(.16)"}],{duration:190,iterations:Infinity,direction:"alternate",easing:"ease-in-out"});
  A($("bb"),[{transform:"scale(.75) rotate(-5deg)"},{transform:"scale(.75) rotate(5deg)"}],{duration:1300,iterations:Infinity,direction:"alternate",easing:"ease-in-out"});
  const D=$("dust");D.replaceChildren();
  for(let i=0;i<32;i++){
    const a=Math.random()*6.283,r=Math.sqrt(Math.random())*320,c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",400+r*Math.cos(a));c.setAttribute("cy",400+r*Math.sin(a));c.setAttribute("r",.8+Math.random()*1.8);c.setAttribute("fill","#f3dc95");D.appendChild(c);
    c.animate([{opacity:0,transform:"translateY(0)"},{opacity:.75,transform:"translateY(-14px)"},{opacity:0,transform:"translateY(-30px)"}],{duration:4000+Math.random()*4000,delay:2800+Math.random()*5000,iterations:Infinity,easing:"ease-in-out",fill:"backwards"});
  }

  let ang=0,last=0,t0=null;
  const first=route.getPointAtLength(0);
  $("bf").setAttribute("transform",`translate(${first.x} ${first.y})`);
  function frame(now){
    if(t0===null)t0=now+START;
    const t=Math.min(Math.max((now-t0)/FT,0),1),p=ease(t)*LEN;
    const a=route.getPointAtLength(p),b=route.getPointAtLength(Math.min(p+2,LEN));
    let target=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90;
    if(t>.93)target=ang+(0-ang)*sm((t-.93)/.07)*0+(((0-ang+540)%360)-180)*.08;
    let diff=((target-ang+540)%360)-180;ang+=diff*.14;
    const bob=Math.sin(now/260)*3*(1-sm(Math.max(0,(t-.9)/.1)));
    $("bf").setAttribute("transform",`translate(${a.x} ${a.y+bob}) rotate(${ang})`);
    if(flap)flap.playbackRate=t>=1?.16:.55+.9*Math.sin(Math.PI*Math.min(t*1.05,1))*.6+.3;
    if(t>0&&t<1&&now-last>45){last=now;sparkle(a.x,a.y);}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}
Promise.race([document.fonts.load('100px "Great Vibes"'),new Promise(r=>setTimeout(r,2500))]).then(play,play);
</script>
</body>
</html>
